name: Synthetic tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: synthetic-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    timeout-minutes: 15
    env:
      PYTHONFAULTHANDLER: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run all synthetic cases with isolated native Tk
        run: python -B run_tests.py --report-json "${{ runner.temp }}/tests.json"
      - name: Build and inspect the actual distribution; test disposable installation
        run: python -B release_gate.py --output "${{ runner.temp }}/pinakeys-package-gate"
  optional-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install the tested optional PDF dependency
        run: python -m pip install pymupdf==1.28.2
      - name: Verify optional native PDF cases
        run: python -B run_tests.py --pattern test_pdf_followup.py
